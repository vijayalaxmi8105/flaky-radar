name: CI Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vitest run --reporter=junit --outputFile=junit-results/results.xml
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit-results/*.xml