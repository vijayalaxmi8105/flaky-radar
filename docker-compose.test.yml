version: "3.8"
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: flaky_radar_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # fast, ephemeral

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"